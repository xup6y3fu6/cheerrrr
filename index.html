<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陳綺貞 - 默契考驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Y2K 網格背景與字體設定 */
        body {
            background-color: #E8F0FE;
            background-image: 
              linear-gradient(rgba(0, 85, 255, 0.15) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0, 85, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #002266;
            font-family: 'Verdana', 'Tahoma', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { display: none; }
        textarea { resize: none; }
        
        /* 復古立體膠囊按鈕 */
        .y2k-btn {
            background: linear-gradient(180deg, #66A3FF 0%, #0044CC 100%);
            border: 2px solid #002266;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.6), 0 4px 0 #002266;
            border-radius: 999px;
            transition: all 0.1s ease;
        }
        .y2k-btn:active {
            transform: translateY(4px);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.6), 0 0px 0 #002266;
        }

        /* 復古視窗卡片 */
        .y2k-window {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #0044CC;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 68, 204, 0.2), inset 0 0 0 2px rgba(255,255,255,0.9);
        }

        /* 內凹輸入框 */
        .y2k-input {
            background-color: #FFFFFF;
            border: 2px solid #88B8FF;
            box-shadow: inset 2px 2px 4px rgba(0, 34, 102, 0.15);
            border-radius: 8px;
        }
        .y2k-input:focus {
            border-color: #0044CC;
            outline: none;
        }

        /* 自訂 select 箭頭 */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230044CC'%3e%3cpolygon points='6,9 18,9 12,16'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 0.8rem;
        }

        /* 像素點陣字體裝飾 */
        .pixel-text {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body class="min-h-screen pb-20 antialiased">

    <div class="max-w-lg mx-auto px-4 py-8 space-y-8">
        
        <!-- Header -->
        <header class="text-center space-y-2 pt-4">
            <div class="inline-block bg-[#0044CC] text-[#00FFFF] px-3 py-1 rounded-full text-[10px] font-bold mb-2 border border-[#002266] tracking-widest pixel-text">
                SYS.VER 1.0 // MUSIC_MATCH
            </div>
            <h1 class="text-2xl font-black text-[#002266] tracking-widest" style="text-shadow: 2px 2px 0px #88B8FF;">
                陳綺貞默契考驗
            </h1>
            <p class="text-[#0044CC] text-xs font-bold tracking-wide">在每張專輯中，挑出你最愛的唯一</p>
        </header>

        <!-- 第一區：選擇區 -->
        <section class="space-y-5">
            
            <!-- 暱稱輸入 -->
            <div class="y2k-window p-3 flex items-center gap-3">
                <div class="bg-[#002266] text-white px-3 py-1.5 rounded-md text-xs font-bold border border-[#0044CC]">
                    USER_ID
                </div>
                <input type="text" id="userName" placeholder="請輸入代號..." class="y2k-input flex-1 py-2 px-3 text-sm font-bold text-[#002266] placeholder-[#88B8FF]">
            </div>

            <!-- 專輯列表容器 -->
            <div id="albumContainer" class="flex flex-col gap-3">
                <!-- 由 JavaScript 渲染 -->
            </div>

            <button id="generateCodeBtn" class="w-full y2k-btn text-white font-black py-3.5 mt-4 text-sm tracking-widest">
                GENERATE / 產生代碼
            </button>

            <!-- 代碼顯示區 -->
            <div id="codeResultArea" class="hidden y2k-window p-4 space-y-3">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#00FF00] shadow-[0_0_5px_#00FF00]"></span>
                    <p class="text-[11px] font-black text-[#002266] tracking-widest pixel-text">CODE_READY</p>
                </div>
                <div class="relative">
                    <textarea id="generatedCode" readonly class="w-full y2k-input p-3 pr-20 text-[10px] font-mono h-20 text-[#0044CC]"></textarea>
                    <button id="copyCodeBtn" class="absolute bottom-2 right-2 bg-gradient-to-b from-[#00FFFF] to-[#00AACC] border border-[#002266] text-[#002266] px-3 py-1.5 rounded-lg text-xs font-black shadow-[inset_0_1px_2px_rgba(255,255,255,0.8)] active:transform active:translate-y-1">
                        COPY
                    </button>
                </div>
            </div>
        </section>

        <!-- 第二區：比對區 -->
        <section class="space-y-4 pt-6 border-t-2 border-[#88B8FF] border-dashed">
            <h2 class="text-sm font-black text-[#002266] tracking-wide flex items-center gap-2">
                <span class="text-[#0044CC]">></span> 進行比對
            </h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="friendCode" placeholder="貼上他的代碼..." class="y2k-input w-full px-4 py-3 text-sm font-bold text-[#002266] placeholder-[#88B8FF]">
                <button id="compareBtn" class="w-full y2k-btn text-white py-3.5 font-black text-sm tracking-widest">
                    ANALYZE / 看結果
                </button>
            </div>
        </section>

        <!-- 第三區：結果展示區 -->
        <section id="resultArea" class="hidden pt-8 mt-8 border-t-2 border-[#88B8FF]">
            
            <div class="y2k-window bg-gradient-to-br from-[#FFFFFF] to-[#E8F0FE] p-5 mb-6 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-sm font-black text-[#0044CC] tracking-widest pixel-text" id="resultMainTitle">MATCH_RESULT</h2>
                    <span class="bg-[#002266] text-[#00FFFF] px-2 py-0.5 rounded text-[9px] font-bold border border-[#0044CC]">100% COMPLETE</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex-1 pr-2 z-10">
                        <h1 class="text-6xl font-black text-[#002266] tracking-tighter" style="text-shadow: 2px 2px 0px #88B8FF;" id="matchPercentage">44%</h1>
                        <p class="text-xs text-[#0044CC] mt-2 font-bold leading-relaxed border-l-2 border-[#00FFFF] pl-2" id="matchQuote">“無數時間線無盡可能性終於交織”</p>
                    </div>
                    <!-- 扇形封面容器 -->
                    <div id="topCoverContainer" class="relative w-28 h-28 shrink-0 flex justify-center items-center z-10">
                        <!-- 封面將透過 JavaScript 扇形渲染 -->
                    </div>
                </div>
                <!-- Y2K 裝飾圓 -->
                <div class="absolute -right-10 -bottom-10 w-32 h-32 border-[10px] border-[#E8F0FE] rounded-full opacity-50"></div>
            </div>

            <!-- 共同選擇 -->
            <div class="y2k-window p-4 mb-4">
                <div class="flex justify-between items-center mb-4 border-b border-[#88B8FF] pb-2">
                    <h3 class="font-black text-[#002266] text-xs tracking-wide">共同選擇</h3>
                    <span class="bg-[#00FFFF] text-[#002266] border border-[#002266] px-2 py-0.5 rounded-md text-[10px] font-black pixel-text" id="commonCountLabel">4/7</span>
                </div>
                <div id="commonChoicesList" class="space-y-2">
                    <!-- 共同選擇清單 -->
                </div>
            </div>

            <!-- 雙邊對比 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#0044CC] border-2 border-[#002266] rounded-xl p-3 text-white shadow-[inset_0_0_10px_rgba(0,0,0,0.2)]">
                    <h3 class="font-bold mb-3 text-[11px] tracking-wide text-[#00FFFF] border-b border-[#002266] pb-1" id="myColumnTitle">我的選擇</h3>
                    <div id="myChoicesList" class="space-y-3">
                        <!-- 我的選擇 -->
                    </div>
                </div>

                <div class="bg-[#E8F0FE] border-2 border-[#88B8FF] rounded-xl p-3 text-[#002266] shadow-[inset_0_0_10px_rgba(255,255,255,0.8)]">
                    <h3 class="font-bold mb-3 text-[11px] tracking-wide border-b border-[#88B8FF] pb-1" id="friendColumnTitle">他的選擇</h3>
                    <div id="friendChoicesList" class="space-y-3">
                        <!-- 他的選擇 -->
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        const chenAlbums = [
            {
                id: "album_01", title: "讓我想一想", year: "1998",
                cover: "https://i.meee.com.tw/Z9O3qXW.jpg",
                tracks: [
                    { id: "t01_01", name: "讓我想一想" }, { id: "t01_02", name: "微涼的你" },
                    { id: "t01_03", name: "會不會" }, { id: "t01_04", name: "情歌" },
                    { id: "t01_05", name: "和你在一起" }, { id: "t01_06", name: "嫉妒" },
                    { id: "t01_07", name: "孤島" }, { id: "t01_08", name: "孩子" },
                    { id: "t01_09", name: "天使" }, { id: "t01_10", name: "漫漫長夜" }
                ]
            },
            {
                id: "album_02", title: "還是會寂寞", year: "2000",
                cover: "https://i.meee.com.tw/IjFYPaq.jpg",
                tracks: [
                    { id: "t02_01", name: "越洋電話" }, { id: "t02_02", name: "我的驕傲無可救藥" },
                    { id: "t02_03", name: "還是會寂寞" }, { id: "t02_04", name: "下午三點" },
                    { id: "t02_05", name: "溫室花朵" }, { id: "t02_06", name: "午餐的約會" },
                    { id: "t02_07", name: "等待" }, { id: "t02_08", name: "慢歌3" },
                    { id: "t02_09", name: "告訴我" }, { id: "t02_10", name: "慢歌1" }, { id: "t02_11", name: "靈感" }
                ]
            },
            {
                id: "album_03", title: "Groupies 吉他手", year: "2002",
                cover: "https://i.meee.com.tw/Y9wVsSX.jpg",
                tracks: [
                    { id: "t03_01", name: "我親愛的偏執狂" }, { id: "t03_02", name: "太聰明" },
                    { id: "t03_03", name: "小步舞曲" }, { id: "t03_04", name: "1234567" },
                    { id: "t03_05", name: "隨便說說" }, { id: "t03_06", name: "躺在你的衣櫃" },
                    { id: "t03_07", name: "A Practice" }, { id: "t03_08", name: "吉他手" },
                    { id: "t03_09", name: "黑眼圈" }, { id: "t03_10", name: "就算全世界與我為敵" },
                    { id: "t03_11", name: "小塵埃" }, { id: "t03_12", name: "不應該" }, { id: "t03_13", name: "躺在你的衣櫃 (Piano)" }
                ]
            },
            {
                id: "album_04", title: "華麗的冒險", year: "2005",
                cover: "https://i.meee.com.tw/zsIZNHo.jpg",
                tracks: [
                    { id: "t04_01", name: "旅行的意義" }, { id: "t04_02", name: "腐朽" },
                    { id: "t04_03", name: "Sentimental Kills" }, { id: "t04_04", name: "華麗的冒險" },
                    { id: "t04_05", name: "太多" }, { id: "t04_06", name: "花的姿態" },
                    { id: "t04_07", name: "Self" }, { id: "t04_08", name: "80%完美的日子" },
                    { id: "t04_09", name: "表面的和平" }, { id: "t04_10", name: "靜靜的生活" },
                    { id: "t04_11", name: "最初的起點" }
                ]
            },
            {
                id: "album_05", title: "太陽", year: "2009",
                cover: "https://i.meee.com.tw/YfCvUc4.jpg",
                tracks: [
                    { id: "t05_01", name: "手的預言" }, { id: "t05_02", name: "狂戀" },
                    { id: "t05_03", name: "太陽" }, { id: "t05_04", name: "魚" },
                    { id: "t05_05", name: "距離" }, { id: "t05_06", name: "倔強愛情的勝利" },
                    { id: "t05_07", name: "失敗者的飛翔" }, { id: "t05_08", name: "下個星期去英國" },
                    { id: "t05_09", name: "另一種平靜" }, { id: "t05_10", name: "煙火" },
                    { id: "t05_11", name: "一首歌，讓你帶回去" }
                ]
            },
            {
                id: "album_06", title: "時間的歌", year: "2013",
                cover: "https://i.meee.com.tw/dod7gVW.jpg",
                tracks: [
                    { id: "t06_01", name: "時間的歌" }, { id: "t06_02", name: "漣漪" },
                    { id: "t06_03", name: "柏拉圖式的愛情" }, { id: "t06_04", name: "Peace & Revolution" },
                    { id: "t06_05", name: "雨水一盒" }, { id: "t06_06", name: "秋天蒙太奇" },
                    { id: "t06_07", name: "流浪者之歌" }, { id: "t06_08", name: "倒數" },
                    { id: "t06_09", name: "沙漏" }, { id: "t06_10", name: "普魯斯特行動" },
                    { id: "t06_11", name: "別送我回家" }, { id: "t06_12", name: "家" }
                ]
            },
            {
                id: "album_07", title: "沙發海", year: "2018",
                cover: "https://i.meee.com.tw/OZap5Em.jpg",
                tracks: [
                    { id: "t07_01", name: "傷害" }, { id: "t07_02", name: "小船" },
                    { id: "t07_03", name: "殘缺的彩虹" }, { id: "t07_04", name: "台北某個地方" },
                    { id: "t07_05", name: "沙發海" }, { id: "t07_06", name: "跳舞吧" },
                    { id: "t07_07", name: "他說" }, { id: "t07_08", name: "華生" },
                    { id: "t07_09", name: "變色龍" }, { id: "t07_10", name: "觀察者" },
                    { id: "t07_11", name: "神魂顛倒" }
                ]
            }
        ];

        const albumContainer = document.getElementById('albumContainer');
        chenAlbums.forEach(album => {
            let optionsHtml = '<option value="">-- 請選擇單曲 --</option>';
            album.tracks.forEach(track => {
                optionsHtml += `<option value="${track.id}">${track.name}</option>`;
            });

            const cardHtml = `
                <div class="y2k-window p-2 flex gap-3 items-center shadow-[0_4px_10px_rgba(0,34,102,0.1)]">
                    <img src="${album.cover}" alt="${album.title}" class="w-14 h-14 rounded-lg object-cover border-2 border-[#88B8FF] shrink-0">
                    <div class="flex-1 min-w-0 pr-1">
                        <h3 class="font-bold text-[13px] text-[#002266] truncate mb-1">${album.title}</h3>
                        <select data-album-id="${album.id}" class="album-select w-full y2k-input py-1.5 px-2 text-[11px] font-bold text-[#0044CC]">
                            ${optionsHtml}
                        </select>
                    </div>
                </div>
            `;
            albumContainer.insertAdjacentHTML('beforeend', cardHtml);
        });

        function getTrackName(trackId) {
            for (let album of chenAlbums) {
                let track = album.tracks.find(t => t.id === trackId);
                if (track) return track.name;
            }
            return "未選擇";
        }

        document.getElementById('generateCodeBtn').onclick = function() {
            const userName = document.getElementById('userName').value.trim() || "我";
            const selects = document.querySelectorAll('.album-select');
            
            let selectedTracks = {};
            let isComplete = true;

            selects.forEach(select => {
                if (!select.value) isComplete = false;
                selectedTracks[select.dataset.albumId] = select.value;
            });

            if (!isComplete) {
                alert("每張專輯都要選一首歌喔！");
                return;
            }

            const data = { n: userName, t: selectedTracks };
            const base64Code = btoa(encodeURIComponent(JSON.stringify(data)));

            document.getElementById('generatedCode').value = base64Code;
            document.getElementById('codeResultArea').classList.remove('hidden');
        };

        document.getElementById('copyCodeBtn').onclick = function() {
            const codeInput = document.getElementById('generatedCode');
            codeInput.select();
            codeInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(codeInput.value).then(() => {
                const btn = document.getElementById('copyCodeBtn');
                btn.textContent = "COPIED";
                setTimeout(() => {
                    btn.textContent = "COPY";
                }, 2000);
            }).catch(() => alert("請手動複製！"));
        };

        document.getElementById('compareBtn').onclick = function() {
            const myName = document.getElementById('userName').value.trim() || "你";
            const friendCode = document.getElementById('friendCode').value.trim();
            const selects = document.querySelectorAll('.album-select');

            let myTracks = {};
            let myComplete = true;
            selects.forEach(select => {
                if (!select.value) myComplete = false;
                myTracks[select.dataset.albumId] = select.value;
            });

            if (!myComplete) {
                alert("請先完成你自己的選擇！");
                return;
            }

            if (!friendCode) {
                alert("請貼上他的代碼！");
                return;
            }

            try {
                const friendData = JSON.parse(decodeURIComponent(atob(friendCode)));
                if (!friendData.n || !friendData.t) throw new Error();

                const friendName = friendData.n;
                const friendTracks = friendData.t;

                document.getElementById('resultMainTitle').textContent = `${myName} x ${friendName}`;
                document.getElementById('myColumnTitle').textContent = `${myName}`;
                document.getElementById('friendColumnTitle').textContent = `${friendName}`;

                let commonHtml = '';
                let myHtml = '';
                let friendHtml = '';
                let matchCount = 0;
                let matchedCovers = []; 
                const total = chenAlbums.length;

                chenAlbums.forEach((album, index) => {
                    const myTrack = getTrackName(myTracks[album.id]);
                    const friendTrack = friendTracks[album.id] ? getTrackName(friendTracks[album.id]) : "未選擇";
                    const isMatch = (myTracks[album.id] === friendTracks[album.id] && myTracks[album.id] !== undefined);

                    if (isMatch) {
                        matchCount++;
                        matchedCovers.push(album.cover); 
                        commonHtml += `
                            <div class="flex items-center gap-3 bg-[#E8F0FE] p-2 rounded-lg border border-[#88B8FF]">
                                <img src="${album.cover}" class="w-10 h-10 rounded border border-[#0044CC] object-cover shrink-0">
                                <div class="flex-1 min-w-0">
                                    <span class="block font-bold text-[#002266] text-xs truncate mb-0.5">${myTrack}</span>
                                    <span class="block text-[9px] font-bold text-[#0044CC] truncate pixel-text">ALBUM_${index + 1}</span>
                                </div>
                            </div>
                        `;
                    }

                    myHtml += `
                        <div class="flex items-center gap-2">
                            <img src="${album.cover}" class="w-7 h-7 rounded border border-[#00FFFF] object-cover shrink-0 opacity-90">
                            <span class="text-[11px] font-bold truncate text-[#E8F0FE]">${myTrack}</span>
                        </div>
                    `;

                    friendHtml += `
                        <div class="flex items-center gap-2">
                            <span class="text-[#88B8FF] text-[9px] font-bold w-3 shrink-0 pixel-text">0${index + 1}</span>
                            <img src="${album.cover}" class="w-7 h-7 rounded border border-[#88B8FF] object-cover shrink-0">
                            <span class="text-[11px] font-bold truncate text-[#0044CC]">${friendTrack}</span>
                        </div>
                    `;
                });

                if (matchCount === 0) {
                    commonHtml = `<p class="text-xs text-[#0044CC] font-bold text-center py-2 pixel-text">NO MATCH FOUND</p>`;
                    matchedCovers.push(chenAlbums[0].cover); 
                }

                document.getElementById('commonChoicesList').innerHTML = commonHtml;
                document.getElementById('myChoicesList').innerHTML = myHtml;
                document.getElementById('friendChoicesList').innerHTML = friendHtml;

                const topCoverContainer = document.getElementById('topCoverContainer');
                let stackHtml = '';
                const totalCovers = matchedCovers.length;

                matchedCovers.forEach((coverUrl, idx) => {
                    const zIndex = idx;
                    const offsetIndex = idx - (totalCovers - 1) / 2; 
                    const rotate = offsetIndex * 6;     
                    const translateX = offsetIndex * 12; 

                    stackHtml += `
                        <div class="absolute w-16 h-16 sm:w-20 sm:h-20 transition-all duration-300 hover:-translate-y-2 hover:scale-110 active:scale-110"
                             style="transform: translateX(${translateX}px) rotate(${rotate}deg); z-index: ${zIndex};"
                             onmouseenter="this.style.zIndex=50" 
                             onmouseleave="this.style.zIndex=${zIndex}"
                             ontouchstart="this.style.zIndex=50"
                             ontouchend="this.style.zIndex=${zIndex}">
                            <img src="${coverUrl}" class="w-full h-full rounded-lg object-cover shadow-[0_4px_10px_rgba(0,34,102,0.3)] border-2 border-white">
                        </div>
                    `;
                });
                topCoverContainer.innerHTML = stackHtml;

                const matchRate = Math.round((matchCount / total) * 100);
                document.getElementById('matchPercentage').textContent = `${matchRate}%`;
                document.getElementById('commonCountLabel').textContent = `${matchCount}/${total}`;

                const quoteEl = document.getElementById('matchQuote');
                if (matchRate === 100) quoteEl.textContent = "“好像除了我，沒人能把你看透”";
                else if (matchRate >= 40) quoteEl.textContent = "“你和我之間，不需要語言”";
                else if (matchRate > 0) quoteEl.textContent = "“為什麼你總沉迷，某種神奇的幻想”";
                else quoteEl.textContent = "“你擁有你的，我擁有我的，姿態”";

                document.getElementById('resultArea').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

            } catch (e) {
                alert("解析失敗，請確認代碼是否完整！");
            }
        };
    </script>
</body>
</html>
